<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
    <linearGradient id="zenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#zenBg)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Sparkles -->
  <path d="M 120 110 Q 120 135 145 135 Q 120 135 120 160 Q 120 135 95 135 Q 120 135 120 110 Z" fill="#FFF" opacity="0.9"/>
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="#FFF" opacity="0.85"/>
  <path d="M 405 380 Q 405 395 420 395 Q 405 395 405 410 Q 405 395 390 395 Q 405 395 405 380 Z" fill="#FFF" opacity="0.75"/>

  <!-- Birthday Cake & Candle Motif -->
  <!-- Candle Flame -->
  <path d="M 256 120 C 242 145 242 165 256 185 C 270 165 270 145 256 120 Z" fill="url(#zenGold)" filter="url(#glow)"/>
  <circle cx="256" cy="165" r="4" fill="#FFFFFF"/>

  <!-- Candle Stick -->
  <rect x="248" y="185" width="16" height="45" rx="6" fill="#FFFFFF"/>
  <path d="M 248 198 L 264 192 M 248 212 L 264 206" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>

  <!-- Cake Tier 1 (Top) -->
  <rect x="196" y="230" width="120" height="50" rx="14" fill="#FFFFFF"/>
  <path d="M 196 248 Q 211 258 226 248 Q 241 258 256 248 Q 271 258 286 248 Q 301 258 316 248" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>

  <!-- Cake Tier 2 (Middle) -->
  <rect x="160" y="280" width="192" height="60" rx="16" fill="#FFFFFF"/>
  <circle cx="190" cy="310" r="6" fill="#FF8E53"/>
  <circle cx="225" cy="310" r="6" fill="#4ECDC4"/>
  <circle cx="256" cy="310" r="6" fill="#FFD93D"/>
  <circle cx="287" cy="310" r="6" fill="#A78BFA"/>
  <circle cx="322" cy="310" r="6" fill="#F472B6"/>

  <!-- Cake Tier 3 (Base) -->
  <rect x="120" y="340" width="272" height="70" rx="18" fill="#FFFFFF"/>
  <path d="M 130 365 Q 160 380 190 365 Q 220 380 256 365 Q 290 380 322 365 Q 352 380 382 365" fill="none" stroke="#FF8E53" stroke-width="5" stroke-linecap="round"/>

  <!-- Cake Stand / Base Plate -->
  <rect x="96" y="410" width="320" height="16" rx="8" fill="rgba(255,255,255,0.9)"/>
  <path d="M 216 426 L 296 426 L 316 450 L 196 450 Z" fill="rgba(255,255,255,0.75)"/>
</svg>
