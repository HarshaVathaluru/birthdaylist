<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="30%" stop-color="#FFF0EB"/>
      <stop offset="70%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="220" fill="url(#bannerBg)"/>

  <!-- Confetti Sprinkles (Teal, Amber, Pink, Coral, Purple, Gold) -->
  <!-- Confetti shapes -->
  <rect x="65" y="45" width="8" height="18" rx="4" transform="rotate(35 65 45)" fill="#FF6B6B"/>
  <rect x="110" y="85" width="7" height="16" rx="3" transform="rotate(-25 110 85)" fill="#4ECDC4"/>
  <rect x="80" y="145" width="8" height="18" rx="4" transform="rotate(55 80 145)" fill="#F59E0B"/>
  <rect x="145" y="30" width="6" height="14" rx="3" transform="rotate(-40 145 30)" fill="#A78BFA"/>
  <rect x="180" y="160" width="7" height="16" rx="3" transform="rotate(20 180 160)" fill="#EC4899"/>
  
  <rect x="420" y="40" width="8" height="18" rx="4" transform="rotate(-30 420 40)" fill="#10B981"/>
  <rect x="480" y="75" width="7" height="16" rx="3" transform="rotate(45 480 75)" fill="#F59E0B"/>
  <rect x="520" y="130" width="8" height="18" rx="4" transform="rotate(-60 520 130)" fill="#FF6B6B"/>
  <rect x="450" y="165" width="7" height="16" rx="3" transform="rotate(15 450 165)" fill="#06B6D4"/>
  <rect x="535" y="45" width="6" height="14" rx="3" transform="rotate(25 535 45)" fill="#8B5CF6"/>

  <!-- Confetti Stars & Dots -->
  <circle cx="50" cy="95" r="4" fill="#F59E0B"/>
  <circle cx="150" cy="120" r="3.5" fill="#FF6B6B"/>
  <circle cx="100" cy="180" r="4" fill="#0D9488"/>
  <circle cx="490" cy="35" r="4" fill="#EC4899"/>
  <circle cx="440" cy="125" r="3.5" fill="#F59E0B"/>
  <circle cx="545" cy="95" r="4.5" fill="#4ECDC4"/>

  <!-- Star Sparkles -->
  <path d="M 130 55 Q 130 65 140 65 Q 130 65 130 75 Q 130 65 120 65 Q 130 65 130 55 Z" fill="#F59E0B"/>
  <path d="M 470 145 Q 470 155 480 155 Q 470 155 470 165 Q 470 155 460 155 Q 470 155 470 145 Z" fill="#FF6B6B"/>
  <path d="M 515 25 Q 515 33 523 33 Q 515 33 515 41 Q 515 33 507 33 Q 515 33 515 25 Z" fill="#0D9488"/>

  <!-- Top Ribbon Badge -->
  <g transform="translate(200, 20)">
    <rect width="200" height="28" rx="14" fill="#FFFFFF" stroke="rgba(13, 148, 136, 0.25)" stroke-width="1.5"/>
    <text x="100" y="18" fill="#0D9488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">✨ SPECIAL MILESTONE ✨</text>
  </g>

  <!-- Festive Typography (Happy Birthday Script Style) -->
  <g transform="translate(300, 115)">
    <!-- Main Festive Text -->
    <text x="0" y="0" fill="url(#textGrad)" font-family="'Brush Script MT', 'Playfair Display', Georgia, cursive, serif" font-size="56" font-weight="700" font-style="italic" text-anchor="middle" letter-spacing="-0.5">
      Happy Birthday!
    </text>
  </g>

  <!-- Cheerful Underline Arc -->
  <path d="M 230 145 Q 300 165 370 145" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="375" cy="143" r="3" fill="#F59E0B"/>

  <!-- Mini Celebration Subtitle -->
  <text x="300" y="185" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    🎉 WISHING YOU JOY, BREAKTHROUGHS &amp; ENDLESS SMILES 🎉
  </text>
</svg>
