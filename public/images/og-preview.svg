<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#2D124D"/>
      <stop offset="45%" stop-color="#140B27"/>
      <stop offset="100%" stop-color="#0A0614"/>
    </radialGradient>
    <linearGradient id="coralSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Cosmic Gradient Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Glowing Aura Orbs in Background -->
  <circle cx="200" cy="150" r="220" fill="#FF6B6B" opacity="0.18" filter="url(#badgeGlow)"/>
  <circle cx="1020" cy="450" r="260" fill="#A78BFA" opacity="0.15" filter="url(#badgeGlow)"/>
  <circle cx="600" cy="550" r="180" fill="#FFD93D" opacity="0.12" filter="url(#badgeGlow)"/>

  <!-- Grid Accent Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 160 80 Q 160 100 180 100 Q 160 100 160 120 Q 160 100 140 100 Q 160 100 160 80 Z" fill="#FFF" opacity="0.8"/>
  <path d="M 1080 140 Q 1080 165 1105 165 Q 1080 165 1080 190 Q 1080 165 1055 165 Q 1080 165 1080 140 Z" fill="#FFD93D" opacity="0.9"/>
  <path d="M 680 90 Q 680 105 695 105 Q 680 105 680 120 Q 680 105 665 105 Q 680 105 680 90 Z" fill="#4ECDC4" opacity="0.85"/>
  <path d="M 220 520 Q 220 535 235 535 Q 220 535 220 550 Q 220 535 205 535 Q 220 535 220 520 Z" fill="#F472B6" opacity="0.8"/>

  <!-- Left Content Box -->
  <!-- Top Tag Capsule -->
  <g transform="translate(100, 110)">
    <rect width="260" height="40" rx="20" fill="rgba(255, 107, 107, 0.15)" stroke="rgba(255, 107, 107, 0.4)" stroke-width="1.5"/>
    <text x="130" y="25" fill="#FF8E53" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">✨ INTENTIONAL WORKSPACE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="225" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="700" letter-spacing="-1">
    Zenitude Workspace
  </text>
  <text x="100" y="295" fill="url(#coralSun)" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-0.5">
    Celebrations &amp; Milestones
  </text>

  <!-- Subtitle -->
  <text x="100" y="365" fill="#A0AEC0" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400">
    Automated celebration engines, personalized greeting studio,
  </text>
  <text x="100" y="398" fill="#A0AEC0" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400">
    and meaningful team connections for high-performing cultures.
  </text>

  <!-- Feature Badges -->
  <g transform="translate(100, 460)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="170" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="85" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">👑 VIP Wishes</text>
    
    <!-- Badge 2 -->
    <rect x="185" y="0" width="190" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="280" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚡ Auto-Trigger 07 AM</text>

    <!-- Badge 3 -->
    <rect x="390" y="0" width="180" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="480" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">💌 Circle Chat &amp; Feed</text>
  </g>

  <!-- Right Floating 3D Celebration Card Graphic -->
  <g transform="translate(780, 110)" filter="url(#softShadow)">
    <!-- Card Frame Glassmorphism -->
    <rect width="320" height="410" rx="32" fill="url(#coralSun)"/>
    <rect x="10" y="10" width="300" height="390" rx="24" fill="#1C1032"/>
    
    <!-- Inner Card Content -->
    <!-- Header Glow Crown -->
    <circle cx="160" cy="90" r="48" fill="url(#coralSun)" opacity="0.25"/>
    <text x="160" y="106" font-size="46" text-anchor="middle">🎂</text>

    <text x="160" y="175" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" text-anchor="middle">Today's Milestone</text>
    <text x="160" y="205" fill="#FFD93D" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">CELEBRATING EXCELLENCE</text>

    <!-- Mini Wish Bubble -->
    <rect x="30" y="235" width="260" height="85" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
    <text x="160" y="268" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">"Wishing you endless joy, radiant</text>
    <text x="160" y="292" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">health, and grand adventures!"</text>

    <!-- Interactive Button Demo -->
    <rect x="50" y="338" width="220" height="42" rx="21" fill="url(#coralSun)"/>
    <text x="160" y="364" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🎉 Join Celebration</text>
  </g>
</svg>

